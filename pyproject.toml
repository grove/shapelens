[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapelens"
version = "0.1.0"
description = "Deterministic SHACL-derived query runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rdflib==7.6.0"]

[tool.setuptools]
packages = ["shapelens"]
